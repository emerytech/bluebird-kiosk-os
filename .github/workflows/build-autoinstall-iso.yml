name: Build Autoinstall ISO

# Release-tag-only build. Cuts a tag matching v* or iso-* (e.g. `v1.2.0`,
# `iso-2026-06-03`) → the ISO + SHA-256 land as release assets.
# Also runnable on-demand from the Actions tab via workflow_dispatch.
on:
  push:
    tags:
      - 'v*'
      - 'iso-*'
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu point release (e.g. 24.04.1)'
        default: '24.04.1'
        required: true

permissions:
  contents: write   # release events need to upload assets

jobs:
  build:
    name: Build BlueBird Kiosk OS autoinstall ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xorriso + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            wget \
            ca-certificates

      - name: Cache stock Ubuntu Server ISO
        uses: actions/cache@v4
        with:
          path: ~/.cache/bluebird-kiosk-os
          key: ubuntu-server-iso-${{ github.event.inputs.ubuntu_version || '24.04.1' }}
          restore-keys: |
            ubuntu-server-iso-

      - name: Build ISO
        env:
          UBUNTU_VERSION: ${{ github.event.inputs.ubuntu_version || '24.04.1' }}
        run: |
          cd iso-builder
          ./build-iso.sh

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluebird-kiosk-autoinstall-iso
          path: |
            iso-builder/dist/*.iso
            iso-builder/dist/*.sha256
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd iso-builder/dist
          iso="$(ls *.iso)"
          # GitHub release assets are hard-capped at 2 GiB, and the stock Ubuntu Server base ISO is
          # already ~2.6 GB, so a single-file upload 422s ("size must be less than 2147483648") and
          # the whole tag build goes red. Split anything over the cap into <2 GiB parts + ship a
          # reassembly note; the .sha256 (of the WHOLE iso) verifies the rejoined file. Small ISOs
          # still upload as a single asset.
          limit=$((2000 * 1024 * 1024))   # 2000 MiB — safely under the 2 GiB hard cap
          size="$(stat -c%s "$iso")"
          if [ "$size" -gt "$limit" ]; then
            echo "ISO is ${size} bytes (> GitHub's 2 GiB asset cap) — splitting into 1900 MiB parts"
            split -b 1900M -d -a 2 --additional-suffix=.part "$iso" "${iso}."
            printf '%s\n' \
              "The BlueBird Kiosk OS autoinstall ISO is larger than GitHub's 2 GiB per-asset limit," \
              "so it is published here as split parts. To rebuild and verify it:" \
              "" \
              "    cat ${iso}.*.part > ${iso}" \
              "    sha256sum -c ${iso}.sha256" \
              "" \
              "Then flash ${iso} to a USB stick (dd / Rufus / balenaEtcher)." \
              > REASSEMBLE.txt
            gh release upload "${GITHUB_REF_NAME}" "${iso}".*.part *.sha256 REASSEMBLE.txt --clobber
            echo "uploaded $(ls "${iso}".*.part | wc -l) ISO parts + checksum + REASSEMBLE.txt"
          else
            gh release upload "${GITHUB_REF_NAME}" "$iso" *.sha256 --clobber
          fi
