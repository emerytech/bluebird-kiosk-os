# Calamares shellprocess module that flips the freshly-installed disk into
# kiosk mode by calling /usr/local/sbin/bluebird-kiosk-activate inside the
# target chroot, after the rootfs is copied and bootloader is installed.
#
# Wired into the Calamares sequence in /etc/calamares/settings.conf.
---
dontChroot: false
timeout: 60
verbose: true

script:
    - "/usr/local/sbin/bluebird-kiosk-activate"
