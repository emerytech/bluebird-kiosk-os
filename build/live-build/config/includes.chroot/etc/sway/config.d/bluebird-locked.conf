# BlueBird Kiosk OS — locked sway configuration.
#
# This file replaces every default keybinding. It does NOT include the upstream
# config; sway loads /etc/sway/config which sources only this file.
#
# Invariants:
#   - No workspace switching
#   - No window movement
#   - No exec rules besides the kiosk Chromium and admin Chromium
#   - No floating-mode toggles; layout is fixed
#   - No SUPER, Ctrl+Alt, etc. that the user can discover by accident

set $kiosk_url file:///opt/bluebird-kiosk/share/loading.html

# Visual: no borders, no titles, black bg.
default_border none
default_floating_border none
hide_edge_borders both
output * background #000000 solid_color
font pango:monospace 1

# Disable all input mods we don't want.
focus_follows_mouse no
mouse_warping none
focus_on_window_activation none

# Disable xkb input bindings for tty switching done via VT keys.
# (NAutoVTs=0 in logind.conf handles the real VT teardown.)

# Disable the default mod-key entirely.
set $mod Mod99

# Keyboard fallback for the admin overlay — for kiosks without a touchscreen
# (where the 5-finger long-press gesture can't fire) or for diagnostics.
# Ctrl+Alt+B launches a separate Chromium window on top of the kiosk
# pointing at the local admin app. The window is PIN-gated like the
# gesture-triggered one.
bindsym Ctrl+Alt+b exec /opt/bluebird-kiosk/bin/launch-admin-overlay

# PIN-gated terminal for field troubleshooting. Ctrl+Alt+T opens a
# `foot` window running pin-terminal, which prompts for the admin PIN
# and only drops to a shell on success (3 tries then closes). This is
# the deliberate shell escape hatch on a hardened kiosk where SSH +
# TTY switching are disabled — it needs the PIN + a physical keyboard.
bindsym Ctrl+Alt+t exec foot /opt/bluebird-kiosk/bin/pin-terminal

# Touchscreen input: tap-to-click and natural scrolling.
input "type:touch" {
    tap enabled
    natural_scroll enabled
}

# Launch either the firstboot wizard (if /etc/bluebird/configured is absent)
# or the kiosk Chromium pinned to $LEGACY_WALL_URL (otherwise). The dispatcher
# runs inside the sway session so Chromium has a Wayland display to attach to.
exec --no-startup-id /opt/bluebird-kiosk/bin/launch-bluebird-session

# Admin overlay is launched on demand by the gesture daemon, not at startup.

# Lock the only visible "window" so it always covers the output.
for_window [app_id="chromium"] fullscreen enable
for_window [app_id="chromium-browser"] fullscreen enable

# Admin overlay window — Chromium picks its app_id based on the page URL,
# so an admin overlay pointed at http://127.0.0.1:7311/admin gets an
# app_id like `chrome-127.0.0.1__admin-Default`. Match that prefix.
#
# Without an explicit rule, sway tiles the admin window beside the
# fullscreen kiosk Chromium, which gives it 0x0 dimensions (invisible).
# Make it floating, size it 800×1000, center it, raise it on top, and
# focus it so the operator can immediately type the PIN.
for_window [app_id="chrome-127.0.0.1__admin.*"] {
    floating enable
    resize set 800 1000
    move position center
    focus
}

# Block screen blanking (BlueBird Legacy Wall is meant to be visible 24/7).
exec swayidle -w timeout 86400 'true'
