# BlueBird Kiosk OS — bound the journal so an unattended kiosk (no human ever prunes
# logs) can't fill its disk over months of uptime, and keep logs across reboots so a
# "needed a power cycle" failure (KI-010 class) can be diagnosed remotely after the fact.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=300M
RuntimeMaxUse=50M
MaxRetentionSec=2week
