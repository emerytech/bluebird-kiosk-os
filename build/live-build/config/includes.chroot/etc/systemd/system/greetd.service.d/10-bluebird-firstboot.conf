# BlueBird: greetd owns the graphical session ONLY until the kiosk is configured.
#
# Fresh install (no /etc/bluebird/configured): greetd starts → sway → the firstboot wizard.
# After firstboot writes /etc/bluebird/configured, bluebird-kiosk.service owns the session (it
# runs sway directly) and greetd must stay out of the way. This condition + the matching
# ConditionPathExists=/etc/bluebird/configured on bluebird-kiosk.service make the two mutually
# exclusive WITHOUT a Conflicts= directive.
#
# Conflicts= used to do this, but it dropped greetd from the boot transaction on a FRESH install:
# bluebird-gesture.service Wants= bluebird-kiosk.service (the only thing pulling that no-[Install]
# standby into boot), so the standby's Conflicts=greetd fired at transaction-build time, *then*
# the standby was condition-skipped (no marker yet) — leaving no compositor and a box stuck at a
# text console. Condition-based mutual exclusion avoids the race entirely.
[Unit]
ConditionPathExists=!/etc/bluebird/configured
