[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bluebird-kiosk"
version = "0.1.0"
description = "BlueBird Kiosk OS on-device control plane (firstboot + admin overlay)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "bcrypt>=4.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["bluebird_kiosk*"]
