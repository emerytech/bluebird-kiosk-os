<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueBird Kiosk</title>
  <link rel="stylesheet" href="/static/kiosk.css">
</head>
<body>
  <div class="shell" style="justify-content:center;text-align:center">
    <div class="card" style="margin:auto;max-width:480px">
      <h2>BlueBird Kiosk</h2>

      <p style="color:var(--bb-muted);font-size:14px">
        If admin PIN is unset, <a href="/admin" style="color:var(--bb-blue-light)">set one</a>.
      </p>
    </div>
  </div>
</body>
</html>
