<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tenant_name or "Legacy Wall" }}</title>
  <link rel="stylesheet" href="/static/legacy_wall.css">
</head>
<body class="lw-body">
  <div id="lw-stage" class="lw-stage">
    <div class="lw-header">
      <div class="lw-brand">
        <div class="lw-dot"></div>
        <span class="lw-school">{{ tenant_name or "Legacy Wall" }}</span>
      </div>
      <div class="lw-status" id="lw-status"></div>
    </div>

    <div class="lw-slot" id="lw-slot">
      <!-- Slides are injected here. Two layers cross-fade. -->
      <img class="lw-img lw-layer-a" id="lw-img-a" alt="">
      <img class="lw-img lw-layer-b" id="lw-img-b" alt="">
      <div class="lw-empty" id="lw-empty">
        <h1>Waiting for content</h1>
        <p>The kiosk has not yet downloaded any photos. They will appear here as soon as the sync completes.</p>
      </div>
    </div>

    <div class="lw-caption" id="lw-caption"></div>
    <div class="lw-footer">
      <div class="lw-count" id="lw-count"></div>
      <div class="lw-version">BlueBird Kiosk OS · v{{ version }}</div>
    </div>
  </div>

  <!-- Offline admin entry. A touch-only kiosk that boots with NO network shows
       this local slideshow and otherwise has no on-screen way to reach the admin
       panel (the 5-finger-hold gesture is undiscoverable). Tap the TOP-LEFT
       corner 5x within 3s to open /admin (the PIN screen — same-origin, fully
       local, works offline) so you can join a new venue's WiFi. The admin page
       enforces the PIN; this only navigates there, it does NOT bypass it. -->
  <div id="lw-admin-hotspot"
       style="position:fixed;top:0;left:0;width:96px;height:96px;z-index:99999;background:transparent;"></div>
  <script>
  (function(){
    var hot=document.getElementById("lw-admin-hotspot");
    if(!hot) return;
    var taps=0, timer=null;
    function reset(){ taps=0; if(timer){clearTimeout(timer);timer=null;} }
    hot.addEventListener("click", function(){
      taps++;
      if(timer) clearTimeout(timer);
      timer=setTimeout(reset, 3000);
      if(taps>=5){ reset(); window.location.href="/admin"; }
    });
  })();
  </script>
  <script src="/static/legacy_wall.js"></script>
</body>
</html>
